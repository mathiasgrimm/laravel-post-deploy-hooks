<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Laravel Post Deploy Hook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#1B2436"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B4A"/>
      <stop offset="1" stop-color="#FF2D20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B4A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>

  <!-- icon -->
  <g transform="translate(96 84)">
    <circle cx="120" cy="100" r="120" fill="url(#glow)"/>

    <!-- release ready check -->
    <!-- cloud -->
    <g fill="#F8FAFC">
      <circle cx="78" cy="104" r="44"/>
      <circle cx="128" cy="82" r="56"/>
      <circle cx="172" cy="108" r="38"/>
      <rect x="42" y="108" width="150" height="48" rx="24"/>
    </g>
  </g>

  <path d="M314 224 l20 20 38 -44" stroke="url(#warm)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="426" y="151" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#F8FAFC">Laravel</text>
  <text x="423" y="217" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#warm)">Post Deploy Hook</text>
  <text x="426" y="265" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#94A3B8">The right release. Then the job.</text>
</svg>
